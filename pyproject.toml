[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-qa"
version = "0.1.0"
description = "QA check construction drawing PDFs: compare ISO 19650 filenames with title-block contents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Document Control QA" }]
dependencies = [
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
drawing-qa = "drawing_qa.cli:main"
tbcheck = "drawing_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drawing_qa = ["default_config/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
