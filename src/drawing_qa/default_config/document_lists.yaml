# Client-portal document-list layouts for the optional revision/title cross-check.
# Column names come from the drawing-schedule updater project configs.
# Matching is by header text (case-insensitive), not column letter, so the same
# layout works even when a portal export shifts columns.

enabled: true

# Skip workbooks that are MBS registers or QA-TB reports, not portal dumps.
skip_name_contains:
  - IRS
  - Drawing Schedule
  - TBCheck
  - QA-TB
  - _designer
  - document_control
  - Comments Report

# Prefer these when more than one spreadsheet is in the folder.
prefer_name_contains:
  - Listing
  - Document List
  - Asite
  - 4Project
  - Export
  - Dump

# Tried in order when locating columns on a header row.
# Default is Oval C+D 4Projects: ISO number in Original Doc Ref (Non-Standard).
# Trillium and West Cromwell Road also use 4Projects but store the number in
# Name (column A). Holloway Park DocHosting uses Drawing/Document (or Title on
# older dumps); Barking Asite uses Doc Ref.
# 4Projects CSV uses the same header names as Excel. CSV downloads cap at 500
# rows — prefer Excel when both are present, and warn when a CSV has exactly 500
# documents. Set doc_ref on those projects below.
headers:
  doc_ref:
    - Original Doc Ref (Non-Standard)
    - Doc Ref
    - Name
    - Drawing/Document
    - Title
  doc_title:
    - Description
    - Doc Title
    - Subject
  revision:
    - Revision
    - Rev
  path:
    - Project Folder
  # 4Projects uses Revision Workflow; Asite / DocHosting use Status.
  # Revision Workflow is listed first because 4Projects also has a Status column
  # that is purpose of issue. Asite also has Workflow Status (RUNNING/COMPLETED);
  # the reader scores columns and keeps Status, not the engine column.
  status:
    - Revision Workflow
    - Workflow State
    - Workflow Status
    - Status
  days_to_expire:
    - Days To Expire
    - Days to Expire
    - Days To Expiry

# Portal wordings that mean the current issue can be superseded.
# A/B/C are client statuses. QA Approved is internal QA done — the issue
# can still be revised, so document control is not asked to change it.
uploadable_statuses:
  - Status A
  - Status B
  - Status C
  - A
  - B
  - C
  - QA Approved

# Internal QA rejected the file. It can be replaced in place (same revision,
# or a project extra such as Trillium P00). Document control is not asked
# to change the status.
replaceable_statuses:
  - QA Rejected
  - QC Rejected

# Raw portal / workflow text -> Status A/B/C (or other). Keys are matched
# case-insensitively. Project maps below are merged on top of this list.
status_map:
  A Proceed: Status A
  A - Proceed: Status A
  A - Proceed (Lead Reviewer): Status A
  A - Authorized and Accepted: Status A
  EA+DM - Status A: Status A
  B Proceed with Comments: Status B
  B - Proceed with Comments: Status B
  B - Proceed with Comments (Lead Reviewer): Status B
  B - Partial Sign Off (with comment): Status B
  EA+DM - Status B: Status B
  C Rejected: Status C
  C - Rejected: Status C
  C - Rejected (Lead Reviewer): Status C
  C-Rejected: Status C
  C- Rejected: Status C
  QA - Rejected: Status C
  Not Approved: Status C
  DM - Status C: Status C
  EA+DM - Status C: Status C
  Pending QA Check: Under Review
  QA Approved: Under Review
  QA Rejected: QA Rejected
  QC Rejected: QA Rejected
  Shared: Under Review
  For Commenting: Under Review
  For QA Check: Under Review
  For Status Change: Under Review
  Reviewed: Under Review
  For Information: For Information
  QA Passed: QA Approved
  Issued: Under Review
  Under Review: Under Review
  # WCR 4Projects CSV/Excel workflow stages (subset exports may only have these).
  Status A: Status A
  Status B: Status B
  Status C: Status C
  Document Control Review: Under Review
  Design Management Review: Under Review
  Consultant Review: Under Review
  QA Check: Under Review

# When a project turns construction_upgrade on, an approved P issue
# (portal status A or B) must be superseded by C01. Purpose of issue
# follows the project's construction whitelist (not a fixed S5/S4 string).
# Projects without the flag keep the normal P01→P02 (or optional C01) rule.
construction_upgrade:
  revision: C01

projects:
  R459:
    name: Oval C+D
    search_keys: [OVCD, OVC, OVD, Oval]
    first_revisions: [P01]
    construction_upgrade: true
    doc_ref: Original Doc Ref (Non-Standard)
  R456:
    name: Trillium
    search_keys: [Tril, Trillium]
    first_revisions: [P01]
    doc_ref: Name
    # QA Rejected re-uploads may keep the portal revision or use P00.
    rejected_revisions: [P00]
  WCR:
    name: West Cromwell Road
    search_keys: [WCR]
    first_revisions: [P01, C01]
    doc_ref: Name
  HPA:
    name: Holloway Park
    search_keys: [HP, HPA]
    first_revisions: [P01]
    doc_ref:
      - Drawing/Document
      - Title
    doc_title: Description
    # DocHosting exports every contractor. Keep only Malcolm's folder tree.
    path_contains:
      - Malcolm
    status_map:
      Construction: Status A
      IFC-pending: Under Review
      For-comment: Under Review
      Information: For Information
      Preliminary: For Information
  J106309:
    name: Barking Riverside
    search_keys: [BR]
    first_revisions: [P01]
    doc_ref: Doc Ref
    status: Status
    # Asite always accepts a new file; do not ask document control to change status.
    document_control: false
  JXXXZ18:
    name: Greenwich Peninsula
    search_keys: [GP]
    first_revisions: [P01]
  H8499:
    name: New Malden
    search_keys: [NM]
    first_revisions: [P01]
