# MBS title block along the bottom of portrait sheets (Status + Number +
# Amendments). Distinct from mbs_right (landscape, Suitability) and
# mbs_classic (Revision Notes, headings not in the text layer).
id: mbs_bottom
name: MBS bottom title block
min_score: 0.75
region:
  left: 0.46
  top: 0.88
  right: 1.0
  bottom: 1.0
history:
  relative_to: page
  region:
    left: 0.46
    top: 0.93
    right: 0.645
    bottom: 1.0
  min_rows: 2
anchors:
  - STATUS
  - NUMBER
  - TITLE
  - REVISION
  - AMENDMENTS
  - PROJECT
  - CLIENT
  - DESCRIPTION
  - BY
required_anchor_groups:
  - [STATUS]
  - [NUMBER]
  - [TITLE]
  - [REVISION]
fields:
  document_reference:
    labels: [NUMBER, DRAWING NO, DRAWING NUMBER, DOCUMENT NUMBER]
    direction: below
    pattern: "[A-Z0-9]+(?:-[A-Z0-9]+){5}-[0-9]+(?:-[0-9]+)?(?:\\s*[.][0-9]+)?"
  title:
    labels: [TITLE, DRAWING TITLE]
    direction: below
  revision:
    labels: [REVISION, REV]
    direction: auto
    pattern: "(?:[PC]\\d{2}|[A-Z]\\d?)"
  suitability:
    labels: [STATUS, SUITABILITY, PURPOSE OF ISSUE]
    direction: below
  date:
    labels: [DATE, ISSUE DATE]
    direction: auto
  client:
    labels: [CLIENT, CLIENT NAME]
    direction: auto
