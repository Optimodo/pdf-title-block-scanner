# ISO 19650 level code (4th field) per project.
#
# Project-Originator-Volume-Level-Type-Role-Number
# Example: R456-MBS-BI-B1-DR-W-605-001  →  level is B1
#
# Copy this file into a config\ folder next to QA-TB-Checker.exe to override.
# Projects with no entry are not checked. Trillium is strict (no BA for basement).

enabled: true
fail_on_error: true

projects:
  R456:
    name: Trillium
    hints:
      BA: Basement must be B1, B2, or B3, not BA.
    values:
      - PL # Piling
      - FN # Foundation
      - B3 # Basement 3
      - B2 # Basement 2
      - B1 # Basement 1
      - LG # Lower Ground
      - "00" # Ground Floor
      - M1 # Mezzanine
      - "01"
      - "02"
      - "03"
      - "04"
      - "05"
      - "06"
      - "07"
      - "08"
      - "09"
      - "10"
      - "11"
      - "12"
      - "13"
      - "14"
      - "15"
      - "16"
      - "17"
