# Title-block client name per ISO 19650 project code (first filename field).
#
# Copy this file into a config\ folder next to TBCheck.exe to override.
# Matching ignores case, extra spaces, and treats "&" as "and". An allowed
# name may be a shorter form of what is printed (Berkeley matches
# "Berkeley Homes"). Projects with no entry are not checked.

enabled: true
fail_on_error: true

projects:
  WCR:
    name: West Cromwell Road
    values:
      - Seven Capital Woodrow
  R459:
    name: Oval C+D
    values:
      - Berkeley
      - Berkeley Homes
  R456:
    name: Trillium
    values:
      - Berkeley
      - Berkeley Homes
  J106309:
    name: Barking Riverside
    values:
      - MEP
      - MBS
      - L&Q
  HPA:
    name: Holloway Park
    values:
      - London Square
