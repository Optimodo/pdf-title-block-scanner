filename:
  # ISO 19650-2: Project-Originator-Volume-Level-Type-Role-Number
  field_count: 7
  revision_pattern: "(?:[PC]\\d{2}|[A-Z]\\d?)"

extraction:
  min_layout_score: 0.7
  first_page_only: true

compare:
  fields:
    document_reference: required
    revision: if_both_present
    title: if_both_present
    suitability: if_both_present
    date: if_both_present

spell_check:
  enabled: true
  language: en_GB  # en_GB for UK English, en_US for US English
  check_title: true
  fail_on_error: true  # Set to false to warn only (add note but don't fail status)

# Purpose-of-issue / suitability whitelist: see suitability.yaml in this folder.
# P revisions are also checked against review/comment status, and C against construction.

# Temporary scan timings printed at the end of a run. Set false (or TBCHECK_TIMING=0)
# once optimisation is done — this module is designed to be removed later.
timing:
  enabled: true

preview:
  # true = crop for every PDF (use this when comparing report/Excel speed).
  # false = only non-MATCH rows (faster on large folders).
  all_files: false
